<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partilhar Localização</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            margin-top:50px;
            padding:20px;
        }

        button{
            background:#005CA9;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

        button:hover{
            background:#004080;
        }

        #resultado{
            margin-top:20px;
            font-size:16px;
        }
    </style>
</head>

<body>

<h2>Partilhar Localização</h2>

<p>Clique no botão abaixo para enviar a sua localização GPS.</p>

<button onclick="obterLocalizacao()">
    Enviar Localização
</button>

<div id="resultado"></div>

<script>

function obterLocalizacao(){

    document.getElementById("resultado").innerHTML =
    "A obter localização...";

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(
            sucesso,
            erro,
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );

    } else {

        document.getElementById("resultado").innerHTML =
        "Geolocalização não suportada neste dispositivo.";

    }

}

function sucesso(posicao){

    let latitude = posicao.coords.latitude;
    let longitude = posicao.coords.longitude;

    fetch("https://www.google.com", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            latitude: latitude,
            longitude: longitude,
            data: new Date().toISOString(),
            maps: "https://default119ca644d1ee49a6b0b443515deb67.54.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/a8b4a2c8dc224fbd876602798120ffd2/triggers/manual/paths/invoke?api-version=1" + latitude + "," + longitude

        })

    })

    .then(response => {

        document.getElementById("resultado").innerHTML =
        "<h3>✅ Localização enviada com sucesso</h3>" +
        "<p>Obrigado pela colaboração.</p>" +
        "<p><a target='_blank' href='https://www.google.com/maps?q=" +
        latitude + "," + longitude +
        "'>Ver localização no Google Maps</a></p>";

    })

    .catch(error => {

        document.getElementById("resultado").innerHTML =
        "<h3>❌ Erro ao enviar localização</h3>";

    });

}

function erro(err){

    document.getElementById("resultado").innerHTML =
    "❌ Não foi possível obter a localização. Verifique as permissões do GPS.";

}

</script>

</body>
</html>
